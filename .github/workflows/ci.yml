name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: npm ci
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg
      - run: uv sync --project tools/experiment --frozen --python 3.12
      - run: npm run experiment:test
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:offline
      - name: Eval check must pass after operator-authorized case review
        run: npm run eval:check
      - name: Fixture eval (deterministic, not a paid model)
        run: EVAL_RUN=true EVAL_PROVIDER=fixture EVAL_BUDGET=42 EVAL_RUN_DIR=tmp-eval-run npm run eval:run
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
