name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: npm ci
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg
      - run: uv sync --project tools/experiment --frozen --python 3.12
      - run: npm run experiment:test
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:offline
      - name: Unsigned eval must still fail (release block, not a silent green)
        run: |
          set +e
          npm run eval:check | tee /tmp/eval-check.json
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "eval:check passed; update this step only after 40 human labels and content/review.json is approved"
            exit 1
          fi
          grep -q unreviewed-case /tmp/eval-check.json
          grep -q need-at-least-40-human-reviewed-cases /tmp/eval-check.json
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
